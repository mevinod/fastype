name: fastype-ci-cd

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Add known host
        run: ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files with rsync
        run: |
          rsync --delete --exclude '.git*' --exclude 'node_modules' --exclude 'fastype.db' -avz \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            . "${{ secrets.USER_NAME }}@${{ secrets.SSH_HOST }}:${{ secrets.FASTYPE_APP_DIR }}"

      - name: Install production deps and restart service
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.USER_NAME }}@${{ secrets.SSH_HOST }}" '
            cd "${{ secrets.FASTYPE_APP_DIR }}" &&
            npm ci --omit=dev &&
            sudo systemctl restart "${{ secrets.FASTYPE_SERVICE_NAME }}" &&
            sudo nginx -t &&
            sudo systemctl reload nginx
          '
